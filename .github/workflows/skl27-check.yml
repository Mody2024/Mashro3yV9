name: SKL27 checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check server.js
      - run: npx --yes esbuild skl27.js --loader:js=jsx --outfile=/tmp/skl27-check.js
